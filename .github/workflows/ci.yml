name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend (unit + integration tests, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: afetdb
          POSTGRES_USER: afetuser
          POSTGRES_PASSWORD: afetpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U afetuser -d afetdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        run: mvn -B -ntp test

      - name: Run integration tests (*IT, against Postgres service)
        run: mvn -B -ntp test -Dtest='*IT' -DfailIfNoTests=false
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/afetdb
          SPRING_DATASOURCE_USERNAME: afetuser
          SPRING_DATASOURCE_PASSWORD: afetpass

      - name: Package
        run: mvn -B -ntp package -DskipTests
