spring:
  application:
    name: afet-koordinasyon

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/afetdb}
    username: ${SPRING_DATASOURCE_USERNAME:afetuser}
    password: ${SPRING_DATASOURCE_PASSWORD:afetpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    connect-retries: 30
    connect-retries-interval: 2

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  demo-users-enabled: ${DEMO_USERS_ENABLED:false}
  # Salt okunur "Admin Demo Modu" ziyaretçi hesabı — varsayılan olarak açık.
  demo-admin-enabled: ${DEMO_ADMIN_ENABLED:true}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:afet-koordinasyon-super-secret-jwt-key-minimum-256-bits-long-2026}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:2592000000}

  security:
    # Refresh token HttpOnly cookie'nin Secure bayrağı. Localhost'ta http üzerinden çalışıldığı
    # için varsayılan false; prod'da (application-prod.yml) true'ya çevrilir.
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
    # Rate limiting için gerçek client IP'sinin X-Forwarded-For'dan okunabileceği güvenilir
    # reverse proxy IP'leri (virgülle ayrılmış). Boşsa X-Forwarded-For'a hiç güvenilmez,
    # doğrudan bağlantı IP'si kullanılır. Nginx arkasında prod'da ayarlanmalıdır.
    trusted-proxies: ${TRUSTED_PROXIES:}

  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:.local-storage}

  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@afetkoordinasyon.tr}}
    type: ${EMAIL_TYPE:prod}

  short-link:
    # /s/{code} redirect endpoint'i backend tarafından sunulur; backend public adresine işaret etmelidir.
    base-url: ${SHORT_LINK_BASE_URL:http://localhost:8080}

  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    test-mode: ${WHATSAPP_TEST_MODE:true}
    test-recipient: ${WHATSAPP_TEST_RECIPIENT:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v20.0}
    base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com}
    # Deprem/simülasyon bildirimleri YALNIZCA approved template ile gider (text fallback yok).
    # Geçici test için Meta'nın hazır hello_world (en_US) template'i; prod için earthquake_alert_tr (tr).
    earthquake-template-name: ${WHATSAPP_EARTHQUAKE_TEMPLATE_NAME:hello_world}
    status-template-name: ${WHATSAPP_STATUS_TEMPLATE_NAME:}
    language-code: ${WHATSAPP_LANGUAGE_CODE:en_US}

  afad:
    base-url: ${AFAD_BASE_URL:https://deprem.afad.gov.tr/apiv2/event/filter}
    fallback-url: ${AFAD_FALLBACK_URL:https://deprem.afad.gov.tr/EventData/GetEventsByFilter}
    polling-interval-ms: ${AFAD_POLLING_INTERVAL_MS:30000}
    startup-hours: ${AFAD_STARTUP_HOURS:48}
    polling-hours: ${AFAD_POLLING_HOURS:24}
    email-test-mode: ${AFAD_EMAIL_TEST_MODE:false}
    email-test-recipient: ${AFAD_EMAIL_TEST_RECIPIENT:beraterdogdu7@gmail.com}

  # Boğaziçi Üniversitesi Kandilli Rasathanesi ve Deprem Araştırma Enstitüsü — resmi
  # "Son Depremler" sayfası (JSON/XML API değil, sabit genişlikli metin tablo; 2026-08'de
  # erişilebilirliği ve formatı manuel doğrulandı). AFAD'dan tamamen bağımsız client/scheduler.
  kandilli:
    base-url: ${KANDILLI_BASE_URL:http://www.koeri.boun.edu.tr/scripts/lst0.asp}
    polling-interval-ms: ${KANDILLI_POLLING_INTERVAL_MS:60000}
    startup-hours: ${KANDILLI_STARTUP_HOURS:48}
    polling-hours: ${KANDILLI_POLLING_HOURS:24}

  building3d:
    # Virgülle ayrılmış District.name listesi — 3B bina katmanının aktif olduğu ilçelerin TEK
    # doğruluk kaynağı, kod içinde district hardcode edilmemeli. Yalnızca gerçekten import
    # edilip doğrulanmış ilçeler burada olmalı (bkz. GET /api/admin/buildings/import-status).
    enabled-districts: ${BUILDING3D_ENABLED_DISTRICTS:Pendik,Kadıköy,Kartal,Beykoz,Adalar,Ataşehir,Çekmeköy,Maltepe,Sancaktepe,Sultanbeyli,Şile,Tuzla,Ümraniye,Üsküdar,Arnavutköy,Avcılar,Bağcılar,Bahçelievler,Bakırköy,Başakşehir,Bayrampaşa,Beşiktaş,Beylikdüzü,Beyoğlu,Büyükçekmece,Çatalca,Esenler,Esenyurt,Eyüpsultan,Fatih,Gaziosmanpaşa,Güngören,Kağıthane,Küçükçekmece,Sarıyer,Silivri,Sultangazi,Şişli,Zeytinburnu}
    level-height-m: ${BUILDING3D_LEVEL_HEIGHT_M:3.0}
    fallback-height-m: ${BUILDING3D_FALLBACK_HEIGHT_M:6.0}
    building-min-zoom: ${BUILDING3D_BUILDING_MIN_ZOOM:15}
    extrusion-min-zoom: ${BUILDING3D_EXTRUSION_MIN_ZOOM:16}

notifications:
  earthquake:
    enabled: ${EARTHQUAKE_NOTIFICATIONS_ENABLED:true}
    min-magnitude: ${EARTHQUAKE_MIN_MAGNITUDE:2.5}
    recipient-roles: ${EARTHQUAKE_RECIPIENT_ROLES:ADMIN,DISTRICT_COORDINATOR,NEIGHBORHOOD_COORDINATOR}

  sms:
    enabled: ${SMS_ENABLED:false}
    test-mode: ${SMS_TEST_MODE:true}
    test-recipient: ${SMS_TEST_RECIPIENT:}
    api-key: ${SMS_API_KEY:}
    api-secret: ${SMS_API_SECRET:}
    sender: ${SMS_SENDER:AFETKOORD}
    provider: ${SMS_PROVIDER:iletimerkezi}
    api-url: ${SMS_API_URL:https://api.iletimerkezi.com/v1/send-sms/json}

ai:
  enabled: ${AI_ENABLED:true}
  provider: ${AI_PROVIDER:claude}
  claude-api-key: ${CLAUDE_API_KEY:}
  openai-api-key: ${OPENAI_API_KEY:}
  model: ${AI_MODEL:claude-haiku-4-5}
  max-photos: ${AI_MAX_PHOTOS:3}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Anonim çağrı yalnızca UP/DOWN görür; bileşen detayları (DB, disk vb.) yalnızca
      # ADMIN rolüne sahip authenticated kullanıcıya gösterilir.
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        # Liveness: yalnızca JVM/process canlı mı? DB geçici olarak erişilemez olsa bile
        # liveness FAIL etmemeli — aksi halde orchestrator gereksiz restart loop'una girer.
        liveness:
          include: livenessState
        # Readiness: gerçek trafik alabilecek durumda mıyız? DB kritik bağımlılık olduğu için
        # dahil edilir. AI provider BİLEREK dahil edilmez — opsiyonel bağımlılık, AI anahtarı
        # yapılandırılmamış/geçici olarak erişilemez olsa da uygulama trafik almaya devam eder.
        readiness:
          include: readinessState, db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    com.afet: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
